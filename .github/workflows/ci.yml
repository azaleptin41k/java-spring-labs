name: Java CI with Maven

on:
  push:
    branches: [ "lab6", "main" ]
  pull_request:
    branches: [ "lab6", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Нам нужен PostgreSQL для тестов
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tournament_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password  # Пароль для CI базы
        ports:
          - 5432:5432
        # Ждем пока база поднимется
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache:maven: true

    # Самый важный шаг: восстанавливаем keystore из секрета
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > src/main/resources/my-app-server.jks

    # Сборка и тестирование
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      env:
        # Передаем переменные для тестов
        DB_PASSWORD: password # Пароль от сервиса postgres выше
        #JWT_SECRET: ${{ secrets.JWT_SECRET }}
        SSL_PASSWORD: ${{ secrets.SSL_PASSWORD }}

    # Сохранение JAR файла как артефакта
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar
        retention-days: 1